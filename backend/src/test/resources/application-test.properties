# Isolated test database configuration
spring.application.name=hms-backend-test
# Fail-closed test database: MUST be injected dynamically via Testcontainers (@DynamicPropertySource) or TEST_MONGODB_URI
# Localhost fallback is strictly forbidden to prevent accidental modification of local databases.
spring.data.mongodb.uri=${TEST_MONGODB_URI:}
spring.data.mongodb.database=${TEST_MONGODB_DATABASE:disposable_test_isolated}
spring.data.mongodb.auto-index-creation=true

