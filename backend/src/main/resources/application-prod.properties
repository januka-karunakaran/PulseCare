# Production Profile Configuration
spring.application.name=hms-backend-prod
logging.level.root=WARN
logging.level.com.hospital.backend=INFO
logging.level.org.springframework.security=WARN

# Strict production settings
server.error.include-stacktrace=never
server.error.include-message=never

spring.data.mongodb.uri=${MONGODB_URI}
# Disable automatic synchronous index creation at startup in production to prevent collection locking
spring.data.mongodb.auto-index-creation=false
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}}
app.mail.enabled=true
