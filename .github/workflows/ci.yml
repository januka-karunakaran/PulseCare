name: HMS Enterprise CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================================
  # Backend Quality Gate: Compile, Validate, Unit & Integration Tests
  # ========================================================
  backend-build-test:
    name: Backend Build & Test (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: ./mvnw -B test

      - name: Build Production JAR
        working-directory: ./backend
        run: ./mvnw -B package -DskipTests

  # ========================================================
  # Frontend Quality Gate: Dependency Check, Lint & Build
  # ========================================================
  frontend-build-test:
    name: Frontend Build & Test (Next.js 16 / React 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint Checks
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
        run: npm run build
