name: HMS Enterprise CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: hms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Backend Quality Gate: Compile, Validate, Unit & Integration Tests
  # ========================================================
  backend-build-test:
    name: Backend Build & Test (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: ./mvnw -B test
        env:
          MAIL_ENABLED: 'false'
          JWT_SECRET: ci-only-jwt-secret-with-at-least-256-bits-entropy-guaranteed

      - name: Build Production JAR
        working-directory: ./backend
        run: ./mvnw -B package -DskipTests

  # ========================================================
  # Frontend Quality Gate: Dependency Check, Lint & Build
  # ========================================================
  frontend-build-test:
    name: Frontend Build & Test (Next.js 16 / React 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint Checks
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
        run: npm run build

  # ========================================================
  # Infrastructure Quality Gate: Compose Config & Container Builds
  # ========================================================
  container-build-validation:
    name: Container & Compose Architecture Validation
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Local Compose Configuration
        run: docker compose config --quiet

      - name: Test Fail-Closed Rejection on Missing Production Compose Secrets
        run: |
          if docker compose -f docker-compose.prod.yml config > /dev/null 2>&1; then
            echo "ERROR: docker-compose.prod.yml failed closed verification: should fail when required secrets are missing!"
            exit 1
          else
            echo "Verified: docker-compose.prod.yml successfully rejects missing required environment variables."
          fi

      - name: Validate Production Compose Schema With Synthetic Secrets
        run: |
          MONGO_ROOT_USER=ci_admin \
          MONGO_ROOT_PASSWORD=ci_synthetic_password_123 \
          JWT_SECRET=ci_synthetic_jwt_secret_with_sufficient_entropy_64chars_hex123 \
          FRONTEND_URL=https://hospital.example.com \
          CORS_ALLOWED_ORIGINS=https://hospital.example.com \
          NEXT_PUBLIC_API_BASE=https://api.hospital.example.com/api \
          NEXT_PUBLIC_WS_URL=wss://api.hospital.example.com/ws \
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Verify MongoDB Port Isolation in Production Compose
        run: |
          if grep -E '^\s*-\s*["'\''0-9]+:27017' docker-compose.prod.yml; then
            echo "ERROR: Found published host port for MongoDB in docker-compose.prod.yml!"
            exit 1
          else
            echo "Verified: MongoDB host port is not published in production compose."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: hms-backend:ci-check

      - name: Validate Frontend Dockerfile Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE=http://localhost:8080/api
            NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
          tags: hms-frontend:ci-check
